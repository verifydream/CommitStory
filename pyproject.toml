[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commitstory"
version = "0.1.0"
description = "CLI tool: git history → readable dev diary via local LLM"
requires-python = ">=3.10"
dependencies = [
    "gitpython>=3.1",
    "rich>=13.0",
    "llama-cpp-python>=0.3.0",
]

[project.scripts]
commitstory = "commitstory.main:main"

[tool.setuptools.packages.find]
include = ["commitstory*"]
